# Cloud Build → Artifact Registry (Next.js web)
#
# Usage:
#   gcloud builds submit --config=cloudbuild.web.yaml \
#     --substitutions=_SERVICE=l2-web-staging,_TAG=manual,_PUBLIC_ORIGIN=https://staging.locumlink.ca,_NEXT_PUBLIC_SUPABASE_URL=...,_NEXT_PUBLIC_SUPABASE_ANON_KEY=...

substitutions:
  _REGION: northamerica-northeast1
  _REPOSITORY: l2
  _SERVICE: l2-web-staging
  _TAG: latest
  _PUBLIC_ORIGIN: https://staging.locumlink.ca
  _API_INTERNAL_URL: ""
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_PUBLIC_ORIGIN}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_PUBLIC_ORIGIN}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - API_INTERNAL_URL=${_API_INTERNAL_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s
