# /etc/nginx/sites-available/locumlink-demo
# ln -s this file to sites-enabled, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name demo.locumlink.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.locumlink.ca;

    ssl_certificate     /etc/letsencrypt/live/demo.locumlink.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.locumlink.ca/privkey.pem;

    client_max_body_size 10m;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 32k;

    location = /api/payments/stripe/webhook {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
